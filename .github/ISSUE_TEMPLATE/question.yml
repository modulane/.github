name: ❓ Question
description: Ask how to use a project.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: Please read the project's README first. It answers most setup and usage questions.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried so far.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Project version and operating system
