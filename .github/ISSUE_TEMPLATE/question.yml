name: ❓ Question
description: Ask how to use a project.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: Please read the project's README first. It answers most setup and usage questions.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried so far.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Project version and operating system
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Required, for everyone. Say whether AI tools helped write this issue.
      options:
        - No AI tool was used
        - AI tools were used
    validations:
      required: true
  - type: textarea
    id: ai-tools
    attributes:
      label: AI tools used
      description: If AI tools were used, name each one and what it did, for example "ChatGPT summarised the error log".
