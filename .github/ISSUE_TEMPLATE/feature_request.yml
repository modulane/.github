name: ✨ Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the need, not the solution. What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you imagine the project could solve it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you have tried.
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Required, for everyone. Say whether AI tools helped write this issue.
      options:
        - No AI tool was used
        - AI tools were used
    validations:
      required: true
  - type: textarea
    id: ai-tools
    attributes:
      label: AI tools used
      description: If AI tools were used, name each one and what it did, for example "ChatGPT summarised the error log".
