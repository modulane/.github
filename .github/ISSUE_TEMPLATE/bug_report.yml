name: 🐛 Bug report
description: Something does not work as described.
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I am using the latest version of the project.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Select `...`
        3. See the error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The project's version, your operating system, your shell or browser, your Node.js version, and any relevant configuration.
      value: |
        Project version:
        Operating system:
        Shell or browser:
        Node.js version:
    validations:
      required: true
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: Required, for everyone. Say whether AI tools helped write this issue.
      options:
        - No AI tool was used
        - AI tools were used
    validations:
      required: true
  - type: textarea
    id: ai-tools
    attributes:
      label: AI tools used
      description: If AI tools were used, name each one and what it did, for example "ChatGPT summarised the error log".
